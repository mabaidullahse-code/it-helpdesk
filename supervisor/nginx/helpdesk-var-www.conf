# ==============================================================================
# Nginx Configuration for IT Helpdesk Portal (For deployment in /var/www/it-helpdesk)
# Subdomain: helpdesk.uhs.edu.pk | Upstream: Octane (Port 8004)
# ==============================================================================

server {
    server_name helpdesk.uhs.edu.pk;
    root /var/www/it-helpdesk/public;

    index index.html index.php;
    client_max_body_size 100M;

    access_log /var/log/nginx/it-helpdesk-access.log;
    error_log /var/log/nginx/it-helpdesk-error.log;

    # Aggressive static asset caching
    location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|svgz?|ttf|ttc|otf|eot|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri @octane;
        access_log off;
    }

    # Public storage uploads
    location ^~ /storage/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
        access_log off;
    }

    location = /index.php {
        return 301 /;
    }

    # Route all requests to Octane (FrankenPHP)
    location / {
        try_files $uri @octane;
    }

    location @octane {
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;

        proxy_pass http://172.16.0.81:8004;

        proxy_read_timeout 3600;
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;

        proxy_intercept_errors on;
        error_page 502 503 504 = @fpm_fallback;
    }

    # PHP fallback if Octane is restarting/down
    location @fpm_fallback {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 3600;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/helpdesk.uhs.edu.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpdesk.uhs.edu.pk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name helpdesk.uhs.edu.pk;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

