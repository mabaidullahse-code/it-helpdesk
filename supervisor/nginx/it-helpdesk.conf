server {
    listen 80;
    server_name helpdesk.uhs.edu.pk; # Change to your preferred domain or server IP
    root /home/quota-mdcat/it-helpdesk/public; # Or /var/www/it-helpdesk/public

    index index.html index.php;
    client_max_body_size 50M;

    access_log /var/log/nginx/it-helpdesk-access.log;
    error_log /var/log/nginx/it-helpdesk-error.log;

    # Static asset caching
    location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|svgz?|ttf|ttc|otf|eot|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Public storage uploads
    location ^~ /storage/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
        access_log off;
    }

    # Route all application requests to Octane (FrankenPHP)
    location / {
        try_files $uri $uri/ @octane;
    }

    location @octane {
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;

        proxy_pass http://172.16.0.81:8004;

        proxy_read_timeout 3600;
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
    }
}

