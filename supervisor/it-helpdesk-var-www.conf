; ==============================================================================
; Laravel Supervised Services Configuration (For deployment in /var/www/it-helpdesk)
; Application: IT Helpdesk & Service Desk Portal
; Port: 8004 | Octane Workers: 4 | Queue Workers: 4
; ==============================================================================

; ------------------------------------------------------------------------------
; 1. Laravel Octane HTTP Server (FrankenPHP) - Port 8004 (4 Workers)
; ------------------------------------------------------------------------------
[program:it-helpdesk-octane]
process_name=%(program_name)s
directory=/var/www/it-helpdesk
command=/usr/bin/php8.4 /var/www/it-helpdesk/artisan octane:start --server=frankenphp --host=172.16.0.81 --port=8004 --workers=4 --max-requests=1000
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/it-helpdesk/storage/logs/octane-supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=30
stopsignal=SIGTERM

; ------------------------------------------------------------------------------
; 2. Queue Workers Pool (4 Workers)
; ------------------------------------------------------------------------------
[program:it-helpdesk-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/it-helpdesk
command=/usr/bin/php8.4 /var/www/it-helpdesk/artisan queue:work --sleep=2 --tries=3 --timeout=120 --max-jobs=1000 --max-time=3600 --memory=512
autostart=true
autorestart=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/it-helpdesk/storage/logs/queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=300
stopsignal=SIGTERM

